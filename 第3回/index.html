<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0">
    <title>わたしのいきもの図鑑</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>わたしのいきもの図鑑</h1>
      <p>気になるいきものを集めた図鑑です。</p>
      <section class="animal-card">
        <h2>レッサーパンダ</h2>
        <img
          src="images/red-panda.png"
          alt="木の枝で休むレッサーパンダのイラスト"
          width="320"
        >
        <p>
          <a href="https://www.tokyo-zoo.net/">
            東京ズーネットで調べる
          </a>
        </p>
      </section>
      <h2>掲載中のいきもの</h2>
      <ul>
        <li>レッサーパンダ</li>
        <li>ペンギン</li>
        <li>カピバラ</li>
      </ul>
    </main>
  </body>
</html>
