<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0">
    <title>わたしのいきもの図鑑</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>わたしのいきもの図鑑</h1>
      <p>気になるいきものを集めた図鑑です。</p>
      <nav class="animal-nav" aria-label="掲載中のいきもの">
        <a href="#red-panda">レッサーパンダ</a>
        <a href="#penguin">ペンギン</a>
        <a href="#capybara">カピバラ</a>
      </nav>
      <div class="animal-grid">
        <section class="animal-card" id="red-panda">
          <h2>レッサーパンダ</h2>
          <img
            src="images/red-panda.png"
            alt="木の枝で休むレッサーパンダのイラスト"
            width="320"
          >
          <p>
            <a href="https://www.tokyo-zoo.net/">
              東京ズーネットで調べる
            </a>
          </p>
        </section>
        <section class="animal-card" id="penguin">
          <h2>ペンギン</h2>
          <img
            src="images/penguin.svg"
            alt="氷の上に立つペンギンのイラスト"
            width="320"
          >
          <p>
            <a href="https://www.tokyo-zoo.net/">
              東京ズーネットで調べる
            </a>
          </p>
        </section>
        <section class="animal-card" id="capybara">
          <h2>カピバラ</h2>
          <img
            src="images/capybara.svg"
            alt="水辺に立つカピバラのイラスト"
            width="320"
          >
          <p>
            <a href="https://www.tokyo-zoo.net/">
              東京ズーネットで調べる
            </a>
          </p>
        </section>
      </div>
    </main>
  </body>
</html>
